name: Step 3 # Last step of the exercise

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    # Skip the initial seeding commit created when a learner generates the repo from the
    # template. That first push to main also carries docs/**, which would otherwise trigger
    # this workflow before the exercise issue exists (and before Step 0 can disable it),
    # producing a failing run. A branch-creation push sets github.event.created == true;
    # later merges to main do not, so grading still runs when the learner progresses.
    if: ${{ !github.event.created }}
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.8.1

  # Grading job: confirms the learner's personas/roles improvement landed in the docs.
  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get response templates
        uses: actions/checkout@v5
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.8.1

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise

      # Ensure the personas/roles update arrived through a merged pull request rather than a
      # commit pushed straight to main. Without this guard, any direct commit that touches
      # docs/** (for example, when the Copilot Cloud Agent commits directly instead of
      # opening a pull request) would satisfy the file check below and finish the exercise
      # before the pull request is ever reviewed and merged. Requiring a merged pull request
      # keeps the intended issue -> pull request -> review -> merge workflow intact.
      - name: Verify the update arrived via a merged pull request
        id: check-merged-pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.after }}
        run: |
          echo "Looking for a merged pull request associated with $HEAD_SHA"
          merged_prs="$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" --jq '[.[] | select(.merged_at != null)]')"
          count="$(echo "$merged_prs" | jq 'length')"
          if [ "$count" -eq 0 ]; then
            echo "::error::This change was pushed directly to main. Open a pull request for the personas and roles update and merge it, rather than committing directly to main."
            exit 1
          fi
          echo "Found merged pull request(s):"
          echo "$merged_prs" | jq -r '.[] | "  #\(.number) \(.title)"'

      # Grade that the learner actually changed the personas/roles doc in the merged
      # pull request, rather than only that the file exists (it ships with the starter repo).
      - name: Check the personas and roles doc was updated in this pull request
        id: check-personas-updated
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          TARGET_FILE: docs/octoacme-roles-and-personas.md
        run: |
          echo "Comparing $BEFORE_SHA...$AFTER_SHA"
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          echo "Files changed in this push:"
          echo "$changed"
          if echo "$changed" | grep -qx "$TARGET_FILE"; then
            echo "$TARGET_FILE was updated."
          else
            echo "::error::$TARGET_FILE was not updated in this pull request."
            exit 1
          fi

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 3
            results_table:
              - description: "Checked the personas and roles update was merged through a pull request"
                passed: ${{ steps.check-merged-pr.outcome == 'success' }}
              - description: "Checked the personas and roles doc was updated in your pull request"
                passed: ${{ steps.check-personas-updated.outcome == 'success' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_review_content:
    name: Post review content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get response templates
        uses: actions/checkout@v5
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.8.1

      - name: Create comment - step finished - final review next
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Disable current workflow
        run: gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_review_content]
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.8.1
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Scale institutional knowledge using Copilot Spaces"
